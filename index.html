<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1B1B1B">
  <title>Твой пост на сегодня</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { background: #1B1B1B; }
    body {
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: #1B1B1B;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }
    button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .game {
      width: min(100%, 390px);
      margin: 0 auto;
      padding: clamp(24px, 11.3744svh, 96px) 21px 24px;
    }
    .topbar { height: 37px; display: flex; justify-content: flex-end; }
    .exit {
      width: 37px;
      height: 37px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      position: relative;
      z-index: 4;
      touch-action: manipulation;
    }
    .exit img { display: block; width: 37px; height: 37px; }
    h1 {
      margin: 13px 0 22px;
      text-align: center;
      font-size: clamp(23px, 7.18vw, 28px);
      font-weight: 400;
      line-height: 34px;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    .board { width: 100%; position: relative; isolation: isolate; }
    .buttons-art {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 696 / 700;
      transition: filter 180ms ease;
      pointer-events: none;
    }
    .board.is-open .buttons-art { filter: blur(7px) brightness(.44); }
    .hotspots {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      column-gap: 6px;
      row-gap: 4px;
      z-index: 1;
    }
    .hotspot {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      border-radius: 11px;
      touch-action: manipulation;
    }
    .hotspot:focus-visible, .exit:focus-visible, .notification-close:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    .board.is-open .hotspots { pointer-events: none; }
    .notification {
      position: absolute;
      z-index: 3;
      top: 30.2857%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 320px;
      padding: 55px 19px 36px;
      border-radius: 15px;
      background: #fff;
      color: #1B1B1B;
      text-align: center;
      box-shadow: 0 5px 22px rgba(0, 0, 0, .13);
    }
    .notification[hidden] { display: none; }
    .notification-close {
      position: absolute;
      top: 14px;
      right: 14px;
      display: block;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      touch-action: manipulation;
    }
    .notification-close img { display: block; width: 30px; height: 30px; }
    .notification-message {
      margin: 0;
      font-size: 21px;
      font-weight: 400;
      line-height: 22px;
      letter-spacing: -.15px;
    }
    .notification-message .line { display: block; white-space: nowrap; }
    .confetti {
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }
    .confetti[hidden] { display: none; }
    .confetti canvas { display: block; width: 100%; height: 100%; }
    @media (max-width: 389px) {
      .game { padding-left: 5.4vw; padding-right: 5.4vw; }
      .notification-message { font-size: clamp(16px, 5.38vw, 21px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .buttons-art { transition: none; }
    }
  </style>
</head>
<body>
  <main class="game">
    <div class="topbar">
      <button class="exit" id="exit" type="button" aria-label="Закрыть игру">
        <img src="exit-black.svg" alt="">
      </button>
    </div>
    <h1>Твой пост на сегодня</h1>
    <div class="board" id="board">
      <img class="buttons-art" src="buttons.png" width="696" height="700" alt="">
      <div class="hotspots" aria-label="Выберите одну из девяти кнопок">
        <button class="hotspot" type="button" data-number="1" aria-label="Кнопка 1"></button>
        <button class="hotspot" type="button" data-number="2" aria-label="Кнопка 2"></button>
        <button class="hotspot" type="button" data-number="3" aria-label="Кнопка 3"></button>
        <button class="hotspot" type="button" data-number="4" aria-label="Кнопка 4"></button>
        <button class="hotspot" type="button" data-number="5" aria-label="Кнопка 5"></button>
        <button class="hotspot" type="button" data-number="6" aria-label="Кнопка 6"></button>
        <button class="hotspot" type="button" data-number="7" aria-label="Кнопка 7"></button>
        <button class="hotspot" type="button" data-number="8" aria-label="Кнопка 8"></button>
        <button class="hotspot" type="button" data-number="9" aria-label="Кнопка 9"></button>
      </div>
      <section class="notification" id="notification" role="dialog" aria-modal="true" aria-label="Твой пост" hidden>
        <button class="notification-close" id="notification-close" type="button" aria-label="Закрыть уведомление">
          <img src="exit-grey.svg" alt="">
        </button>
        <p class="notification-message" id="notification-message"></p>
      </section>
    </div>
  </main>
  <div class="confetti" id="confetti" aria-hidden="true" hidden>
    <canvas id="confetti-canvas"></canvas>
  </div>
  <script>
    (() => {
      'use strict';

      // Each entry is one exact line of the corresponding design mockup.
      const messages = [
        ['Пост, который 2 часа нужно', 'оформлять в статьях'],
        ['Срочнейший пост'],
        ['Пост после', 'третьих правок'],
        ['Пост с фактурой', 'на 9 карточек'],
        ['Пост, чтобы обыграть', 'ежегодный инфоповод'],
        ['Коротенький пуш'],
        ['Подводка к видео,', 'не парься)'],
        ['Пост, который нужно будет', 'согласовать с 6 людьми'],
        ['✨Отмененный пост✨']
      ];

      const board = document.getElementById('board');
      const dialog = document.getElementById('notification');
      const message = document.getElementById('notification-message');
      const dialogClose = document.getElementById('notification-close');
      const confetti = document.getElementById('confetti');
      const confettiCanvas = document.getElementById('confetti-canvas');
      const confettiContext = confettiCanvas.getContext('2d');
      const keys = [...document.querySelectorAll('.hotspot')];
      const tg = window.Telegram && window.Telegram.WebApp;
      let lastKey = null;
      let confettiFrame = 0;

      if (tg) {
        tg.ready();
        try { tg.setBackgroundColor('#1B1B1B'); } catch (_) { /* older clients */ }
      }

      function stopConfetti() {
        cancelAnimationFrame(confettiFrame);
        confettiFrame = 0;
        confetti.hidden = true;
        if (confettiContext) {
          confettiContext.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }
      }

      function startConfetti() {
        stopConfetti();
        if (!confettiContext) return;

        const width = window.innerWidth;
        const height = window.innerHeight;
        const scale = Math.min(window.devicePixelRatio || 1, 1.5);
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const colors = ['#F8A800', '#FFCE55', '#FFF1BA', '#F4A000'];
        confettiCanvas.width = Math.round(width * scale);
        confettiCanvas.height = Math.round(height * scale);
        confettiContext.setTransform(scale, 0, 0, scale, 0, 0);

        const pieces = Array.from({ length: reducedMotion ? 18 : 28 }, (_, index) => ({
          x: Math.random() * width,
          y: reducedMotion ? height * (.18 + Math.random() * .35) : -20 - Math.random() * 100,
          width: 7 + Math.random() * 5,
          height: 13 + Math.random() * 12,
          drift: (Math.random() - .5) * (reducedMotion ? 35 : 150),
          distance: reducedMotion ? 60 + Math.random() * 50 : height + 170,
          angle: (Math.random() - .5) * Math.PI,
          spin: (Math.random() - .5) * (reducedMotion ? 1 : 10),
          delay: Math.random() * (reducedMotion ? .24 : .65) - .25,
          duration: reducedMotion ? 1.1 + Math.random() * .35 : 2.4 + Math.random() * 1.1,
          color: colors[index % colors.length]
        }));
        const startedAt = performance.now();
        const lastFinish = Math.max(...pieces.map(piece => piece.delay + piece.duration));
        confetti.hidden = false;

        function draw(now) {
          const elapsed = (now - startedAt) / 1000;
          confettiContext.clearRect(0, 0, width, height);
          for (const piece of pieces) {
            const progress = (elapsed - piece.delay) / piece.duration;
            if (progress < 0 || progress > 1) continue;
            const x = piece.x + piece.drift * progress + Math.sin(progress * 9) * 7;
            const y = piece.y + piece.distance * progress;
            confettiContext.save();
            confettiContext.globalAlpha = Math.min(1, progress * 9, (1 - progress) * 9);
            confettiContext.translate(x, y);
            confettiContext.rotate(piece.angle + piece.spin * progress);
            confettiContext.fillStyle = piece.color;
            confettiContext.fillRect(-piece.width / 2, -piece.height / 2, piece.width, piece.height);
            confettiContext.restore();
          }
          if (elapsed < lastFinish) {
            confettiFrame = requestAnimationFrame(draw);
          } else {
            stopConfetti();
          }
        }
        confettiFrame = requestAnimationFrame(draw);
      }

      function showMessage(number, key) {
        if (!dialog.hidden) return;
        lastKey = key;
        message.replaceChildren();
        for (const line of messages[number - 1]) {
          const span = document.createElement('span');
          span.className = 'line';
          span.textContent = line;
          message.appendChild(span);
        }
        board.classList.add('is-open');
        dialog.hidden = false;
        keys.forEach(button => { button.tabIndex = -1; });
        dialogClose.focus({ preventScroll: true });
        if (number === 9) startConfetti();
      }

      function hideMessage() {
        if (dialog.hidden) return;
        dialog.hidden = true;
        board.classList.remove('is-open');
        keys.forEach(button => { button.tabIndex = 0; });
        stopConfetti();
        lastKey?.focus({ preventScroll: true });
      }

      keys.forEach((key, index) => key.addEventListener('click', () => showMessage(index + 1, key)));
      dialogClose.addEventListener('click', hideMessage);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !dialog.hidden) hideMessage();
      });
      document.getElementById('exit').addEventListener('click', () => {
        if (tg && typeof tg.close === 'function') {
          tg.close();
        } else if (window.history.length > 1) {
          window.history.back();
        } else {
          window.close();
        }
      });
    })();
  </script>
</body>
</html>
